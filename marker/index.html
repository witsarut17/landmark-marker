<!DOCTYPE html>
<!-- ไม่มีการโหลดอะไรจากภายนอก: ไม่มี CDN, ไม่มี analytics, ไม่มีฟอนต์ภายนอก · ติดต่อได้เฉพาะเซิร์ฟเวอร์ของโครงการเอง (connect-src 'self') -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob: data:; connect-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!-- ไม่ตั้งเป็นแอปแยก (apple-mobile-web-app-capable): ไอคอนบนหน้าจอโฮมจะได้เปิดใน Safari ใช้การเข้าสู่ระบบร่วมกับลิงก์ส่วนตัว -->
<meta name="apple-mobile-web-app-title" content="PelNav Marker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>PelNavPlan Landmark Marker</title>
<link rel="stylesheet" href="style.css?v=1.3.3">
</head>
<body>

<header id="topbar">
  <div class="group">
    <button id="btnCases" class="btn" hidden title="กลับไปหน้ารายการเคส">☰ เคส</button>
    <span id="taskLabel" class="task-label">— / —</span>
    <span id="progress"></span>
    <span class="jump-box">
      <input id="jumpInput" class="jump-input" type="text" inputmode="numeric" maxlength="6" placeholder="ไปที่งาน" aria-label="ไปที่งาน (พิมพ์เลขงาน)" disabled>
      <button id="btnJump" class="btn btn-small" disabled title="ไปที่งานตามเลขที่พิมพ์">ไป</button>
    </span>
  </div>
  <div class="group">
    <button id="btnPrev" class="btn btn-icon" disabled title="ก่อนหน้า" aria-label="ก่อนหน้า">◀</button>
    <button id="btnNext" class="btn btn-primary" disabled>ถัดไป ▶</button>
    <button id="btnSkip" class="btn" disabled title="ข้ามงานนี้ไปก่อน — เว็บจะพากลับมาเมื่อทำงานอื่นครบ">ข้าม</button>
    <button id="btnUnmarkable" class="btn" disabled title="เลือกเหตุผลที่มาร์กงานนี้ไม่ได้">มาร์กไม่ได้</button>
  </div>
  <div class="group">
    <button id="btnUndo" class="btn btn-icon" disabled title="ย้อนการกระทำล่าสุด (Ctrl/⌘+Z)" aria-label="ย้อน">↶</button>
    <button id="btnDelete" class="btn" disabled title="ลบจุดที่เลือก (Delete)">ลบจุด</button>
    <button id="btnFinger" class="btn" aria-pressed="false" title="เปิดเมื่อไม่ได้ใช้ Apple Pencil">นิ้ววางจุด: ปิด</button>
    <button id="btnFinish" class="btn" disabled title="ส่งงานที่ค้างให้ครบ แล้วพักหรือออกจากระบบ">พักงาน</button>
    <span id="userLabel" class="muted small" title="บัญชีที่เข้าสู่ระบบ" hidden></span>
    <button id="btnDebug" class="btn btn-ghost" title="แผงดีบัก (สำหรับทีม)" aria-label="ดีบัก">⋯</button>
  </div>
</header>

<div id="hintBar">
  <span id="hintChip" class="chip"></span>
  <span id="hintText">กำลังเปิดงาน…</span>
  <span id="pairCount" class="muted"></span>
  <span id="warnText" class="warn"></span>
  <span id="saveLabel" class="muted small"></span>
  <button id="btnNote" class="btn btn-small" disabled title="หมายเหตุสั้น ๆ ของงานนี้ (ไม่บังคับ)">หมายเหตุ</button>
  <span id="howTo" class="muted small"></span>
</div>

<main id="workspace">
  <section class="pane" id="paneX">
    <div class="pane-head">
      <strong>เอกซเรย์</strong>
      <span class="readout" id="readoutX">—</span>
      <button class="btn btn-small" id="btnXView">ดูทั้งภาพ</button>
      <button class="btn btn-small" data-adjust="xray">ปรับภาพ</button>
    </div>
    <div class="viewer" id="viewerX"></div>
    <div class="adjust-pop" id="adjustX" hidden>
      <label>ความสว่าง <input type="range" min="0.5" max="2" step="0.05" value="1" data-k="brightness"></label>
      <label>ความเปรียบต่าง <input type="range" min="0.5" max="3" step="0.05" value="1" data-k="contrast"></label>
      <label class="check"><input type="checkbox" id="chkBox" checked> แสดงกรอบ (เส้นประ)</label>
      <div class="row"><button class="btn btn-small" data-adjust-reset>ค่าเริ่มต้น</button><button class="btn btn-small" data-adjust-close>ปิด</button></div>
    </div>
  </section>
  <section class="pane" id="paneF">
    <div class="pane-head">
      <strong>ฟลู</strong>
      <span class="readout" id="readoutF">—</span>
      <button class="btn btn-small" data-reset="fluoro" title="กลับไปขนาดและตำแหน่งเริ่มต้น">รีเซ็ต</button>
      <button class="btn btn-small" data-adjust="fluoro">ปรับภาพ</button>
    </div>
    <div class="viewer" id="viewerF"></div>
    <div class="adjust-pop" id="adjustF" hidden>
      <label>ความสว่าง <input type="range" min="0.5" max="2" step="0.05" value="1" data-k="brightness"></label>
      <label>ความเปรียบต่าง <input type="range" min="0.5" max="3" step="0.05" value="1" data-k="contrast"></label>
      <label class="check"><input type="checkbox" data-k="invert"> กลับสีภาพ</label>
      <div class="row"><button class="btn btn-small" data-adjust-reset>ค่าเริ่มต้น</button><button class="btn btn-small" data-adjust-close>ปิด</button></div>
    </div>
  </section>
</main>

<!-- หน้าแรก: เข้าสู่ระบบ / สถานะการเชื่อมต่อ -->
<div id="startScreen" class="overlay">
  <div class="card start-card">
    <div class="brand">
      <img class="brand-logo" src="icon-180.png" alt="">
      <h1>PelNav</h1>
      <p>มาร์กจุดอ้างอิง</p>
    </div>
    <div id="startMsgBox" class="status-box" hidden>
      <p id="startMsg" class="status"></p>
      <div class="row row-center"><button id="btnRetry" class="btn btn-primary btn-big" hidden>ลองใหม่</button></div>
    </div>
    <div id="loginCard" hidden>
      <p id="loginMsg" class="small err-text"></p>
      <p class="lead">แตะ<b>ลิงก์ส่วนตัว</b>ที่ได้รับ เว็บจะเข้าสู่ระบบให้เอง</p>
      <form id="linkForm" class="login-form">
        <label class="small muted" for="linkInput">หรือวางลิงก์ที่นี่</label>
        <input id="linkInput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="http://…#t=…">
        <button id="btnLink" class="btn btn-primary btn-big" type="submit">เข้าสู่ระบบ</button>
        <p id="loginErr" class="small err-text"></p>
      </form>
      <p class="foot small muted">ทีมวิจัย: <a href="admin.html">หน้าทีม</a></p>
    </div>
  </div>
</div>

<!-- หน้ารายการเคส (การศึกษา ทีมมาร์ก-หมอตรวจ) -->
<div id="caseScreen" class="overlay" hidden>
  <div class="card case-card">
    <div class="case-head">
      <img class="brand-logo" src="icon-180.png" alt="">
      <div>
        <h1 id="caseTitle">รายการเคส</h1>
        <p id="caseSummary"></p>
      </div>
    </div>
    <div class="case-progress" aria-hidden="true"><span id="caseBar"></span></div>
    <p id="caseMsg" class="ok-text"></p>
    <button id="btnContinue" class="btn btn-primary btn-big">ทำต่อ ▶</button>
    <div class="case-tools">
      <label class="check small"><input type="checkbox" id="caseFilter"> ซ่อนเคสที่เสร็จแล้ว</label>
    </div>
    <div id="caseList" class="case-list"></div>
    <div class="case-foot">
      <span id="caseUser" class="muted small"></span>
      <button id="btnCasePause" class="btn">พักงาน</button>
    </div>
  </div>
</div>

<!-- หน้าต่างถาม/เลือก (ใช้ร่วมกัน) -->
<div id="dialog" class="overlay" hidden>
  <div class="card" role="dialog" aria-labelledby="dialogTitle">
    <h2 id="dialogTitle"></h2>
    <div id="dialogBody"></div>
    <div class="row" id="dialogButtons"></div>
  </div>
</div>

<!-- หน้าต่างข้อผิดพลาดที่ต้องหยุด -->
<div id="errorModal" class="overlay" hidden>
  <div class="card card-error" role="alertdialog" aria-labelledby="errorTitle">
    <h2 id="errorTitle">หยุด</h2>
    <ul id="errorList"></ul>
    <div class="row"><button id="btnErrorClose" class="btn btn-primary btn-big">รับทราบ</button></div>
  </div>
</div>

<div id="toast" role="status" hidden></div>

<!-- แผงดีบัก (ดูข้อผิดพลาดบน iPad ได้โดยไม่ต้องใช้ Mac) -->
<aside id="debugPanel" hidden>
  <div class="debug-head">
    <strong>ดีบัก</strong>
    <button id="btnDebugClear" class="btn btn-small">ล้าง</button>
    <button id="btnDebugClose" class="btn btn-small">ปิด</button>
  </div>
  <pre id="debugInfo"></pre>
  <pre id="debugLog"></pre>
</aside>

<script src="version.js?v=1.3.3"></script>
<script src="config.js?v=1.3.3"></script>
<script src="viewer.js?v=1.3.3"></script>
<script src="loader.js?v=1.3.3"></script>
<script src="store.js?v=1.3.3"></script>
<script src="app.js?v=1.3.3"></script>
</body>
</html>
