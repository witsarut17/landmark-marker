# เผยแพร่เฉพาะโฟลเดอร์ marker/ (ตัวเว็บ) ขึ้น GitHub Pages
# ไม่มีภาพหรือข้อมูลผู้ป่วยในเว็บ — ตรวจด้วย tools/check_publish.py ก่อนทุกครั้ง
# v1.0 ขึ้นไปเป็นรุ่นเซิร์ฟเวอร์ (ต้องมีโปรแกรม server/ อยู่เบื้องหลัง) ใช้บน GitHub Pages ไม่ได้
# จึงไม่เผยแพร่อัตโนมัติเมื่อ push แล้ว — GitHub Pages คงเป็น v0.9.0 (รุ่นเลือกไฟล์) ไว้เป็นตัวสาธิตและทางสำรอง
# สั่งเผยแพร่เองได้ที่แท็บ Actions เฉพาะเมื่อตั้งใจจริง
name: Deploy marker to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Safety check (no patient data in marker/)
        run: python3 tools/check_publish.py --pages-only
      - name: Version check (version.js = every ?v= in index.html)
        run: python3 tools/bump_version.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marker
      - id: deployment
        uses: actions/deploy-pages@v4
